<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4b4799" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Usuários - HoraControl</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=8)}" />
  </head>
  <body class="hc-app">
    <div class="hc-shell">
      <aside class="hc-sidebar">
        <a class="hc-brand" th:href="@{/perfil}" aria-label="Ir para o painel"
          ><img
            class="hc-brand-logo"
            th:src="@{/img/b0091c4a-e98d-4afa-8cb6-fda9ae1fe25f.png}"
            alt="Senac"
        /></a>
        <nav class="hc-nav">
          <a th:href="@{/perfil}"><i class="fi fi-rr-home" aria-hidden="true"></i><span>Painel</span></a
          ><a th:href="@{/ponto}"><i class="fi fi-rr-time-check" aria-hidden="true"></i><span>Meu ponto</span></a
          ><a th:href="@{/relatorios}"><i class="fi fi-rr-document" aria-hidden="true"></i><span>Relatórios</span></a
          ><a th:href="@{/gestao-turmas}"><i class="fi fi-rr-graduation-cap" aria-hidden="true"></i><span>Turmas</span></a
          ><a th:href="@{/usuarios}" aria-current="page"
            ><i class="fi fi-rr-users" aria-hidden="true"></i><span>Usuários</span></a
          ><a th:href="@{/configuracoes}"><i class="fi fi-rr-settings" aria-hidden="true"></i><span>Configurações</span></a>
        </nav>
        <div class="hc-sidebar-footer">
          <button type="button" class="hc-btn secondary" data-theme-toggle></button>
          <form th:action="@{/logout}" method="post">
            <button class="hc-logout"><i class="fi fi-rr-sign-out-alt" aria-hidden="true"></i>Sair</button>
          </form>
        </div>
      </aside>
      <main class="hc-main">
        <header class="hc-header">
          <div>
            <h1>Usuários e acessos</h1>
            <p>
              Crie contas e determine exatamente o que cada perfil pode acessar.
            </p>
          </div>
          <button class="hc-btn primary" id="novoUsuario">
            Novo usuário
          </button>
        </header>
        <section class="hc-card" id="filtrosUsuarios" data-filter-root>
          <div class="hc-filter-toolbar">
            <button
              class="hc-btn secondary"
              type="button"
              data-filter-toggle
              aria-expanded="false"
              aria-controls="modalFiltrosUsuarios"
            >
              Filtros
              <span class="hc-filter-active-badge" data-filter-active-badge hidden
                >Ativos</span
              >
            </button>
            <button
              class="hc-btn secondary"
              type="button"
              data-filter-clear-active
              data-limpar-usuarios
              hidden
            >
              Limpar filtros
            </button>
          </div>
          <div class="hc-modal hc-filter-modal" id="modalFiltrosUsuarios" data-filter-panel role="dialog" aria-modal="true" aria-labelledby="tituloFiltrosUsuarios" hidden>
            <div class="hc-modal-panel">
              <div class="hc-modal-head">
                <h2 id="tituloFiltrosUsuarios">Filtrar usuários</h2>
                <button class="hc-btn secondary" type="button" data-filter-close>Fechar</button>
              </div>
              <form id="formFiltrosUsuarios">
              <div class="hc-form-grid">
                <div class="hc-field">
                  <label for="filtroUsuarioBusca">Nome, matrícula ou e-mail</label>
                  <input id="filtroUsuarioBusca" placeholder="Buscar usuário" />
                </div>
                <div class="hc-field">
                  <label for="filtroUsuarioPerfil">Perfil</label>
                  <select id="filtroUsuarioPerfil">
                    <option value="">Todos</option>
                    <option value="PROFESSOR">Professor</option>
                    <option value="COORDENADOR_CURSO">Coordenador de curso</option>
                    <option value="COORDENADOR_NUCLEO">Coordenador de núcleo</option>
                    <option value="COORDENADOR_EIXO">Coordenador de eixo</option>
                    <option value="ADMIN">Administrador</option>
                  </select>
                </div>
                <div class="hc-field">
                  <label for="filtroUsuarioCurso">Curso</label>
                  <select id="filtroUsuarioCurso"><option value="">Todos</option></select>
                </div>
                <div class="hc-field">
                  <label for="filtroUsuarioTurma">Turma vinculada</label>
                  <select id="filtroUsuarioTurma"><option value="">Todas</option></select>
                </div>
                <div class="hc-field">
                  <label for="filtroUsuarioStatus">Situação</label>
                  <select id="filtroUsuarioStatus">
                    <option value="">Todos</option>
                    <option value="true">Ativos</option>
                    <option value="false">Inativos</option>
                  </select>
                </div>
                <div class="hc-field">
                  <label for="filtroUsuarioOrdem">Ordenar</label>
                  <select id="filtroUsuarioOrdem">
                    <option value="az">Nome A–Z</option>
                    <option value="za">Nome Z–A</option>
                    <option value="recentes">Mais recentes</option>
                  </select>
                </div>
              </div>
              <div class="hc-actions">
                <button class="hc-btn primary" type="submit">Aplicar filtros</button>
                <button class="hc-btn secondary" type="button" data-limpar-usuarios>
                  Limpar filtros
                </button>
              </div>
              </form>
            </div>
          </div>
          <div class="hc-table-wrap" style="margin-top: 18px">
            <table class="hc-table">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Matrícula</th>
                  <th>E-mail</th>
                  <th>Perfil</th>
                  <th>Curso/escopo</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="corpoUsuarios">
                <tr>
                  <td colspan="7" class="hc-empty">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div
      class="hc-modal"
      id="modalUsuario"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tituloModal"
    >
      <div class="hc-modal-panel">
        <div class="hc-modal-head">
          <h2 id="tituloModal">Novo usuário</h2>
          <button class="hc-btn secondary" type="button" data-fechar>
            Fechar
          </button>
        </div>
        <form id="formUsuario">
          <input type="hidden" id="usuarioId" />
          <div class="hc-form-grid">
            <div class="hc-field">
              <label for="nome">Nome completo</label
              ><input id="nome" required maxlength="150" />
            </div>
            <div class="hc-field">
              <label for="matricula">Matrícula</label
              ><input id="matricula" maxlength="50" />
            </div>
            <div class="hc-field">
              <label for="cpf">CPF</label
              ><input id="cpf" maxlength="14" inputmode="numeric" />
            </div>
            <div class="hc-field">
              <label for="telefone">Telefone</label
              ><input id="telefone" maxlength="30" inputmode="tel" />
            </div>
            <div class="hc-field full">
              <label for="email">E-mail de acesso</label
              ><input type="email" id="email" required autocomplete="off" />
            </div>
            <div class="hc-field">
              <label for="perfil">Nível de acesso</label
              ><select id="perfil" required>
                <option value="PROFESSOR">Professor</option>
                <option value="COORDENADOR_CURSO">Coordenador de curso</option>
                <option value="COORDENADOR_NUCLEO">
                  Coordenador de núcleo
                </option>
                <option value="COORDENADOR_EIXO">Coordenador de eixo</option>
                <option value="ADMIN">Administrador</option>
              </select>
            </div>
            <div class="hc-field">
              <label for="senha"
                >Senha inicial
                <span class="hc-muted" id="senhaAjuda"></span></label
              ><input
                type="password"
                id="senha"
                minlength="6"
                autocomplete="new-password"
              />
            </div>
            <div class="hc-field">
              <label for="cursoResponsavelId">Curso de responsabilidade</label
              ><select id="cursoResponsavelId">
                <option value="">Nenhum/escopo geral</option>
              </select>
            </div>
            <div class="hc-field">
              <label for="ativo">Situação</label
              ><select id="ativo">
                <option value="true">Ativo</option>
                <option value="false">Inativo</option>
              </select>
            </div>
            <div class="hc-field full">
              <label for="turmaIds"
                >Turmas do professor (Ctrl para selecionar várias)</label
              ><select id="turmaIds" multiple size="6"></select>
            </div>
          </div>
          <div class="hc-actions">
            <button class="hc-btn primary" type="submit">Salvar usuário</button
            ><button class="hc-btn secondary" type="button" data-fechar>
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
    <script th:src="@{/js/app.js(v=8)}"></script>
    <script th:src="@{/js/Usuarios.js(v=8)}"></script>
  </body>
</html>
