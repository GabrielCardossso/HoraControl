<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4b4799" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Registros de ponto - HoraControl</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="hc-app">
    <div class="hc-shell">
      <aside class="hc-sidebar" aria-label="Navegação principal">
        <a class="hc-brand" th:href="@{/perfil}" aria-label="Ir para o painel"
          ><img
            class="hc-brand-logo"
            th:src="@{/img/b0091c4a-e98d-4afa-8cb6-fda9ae1fe25f.png}"
            alt="Senac"
        /></a>
        <nav class="hc-nav">
          <a th:href="@{/perfil}">⌂ <span>Painel</span></a
          ><a th:href="@{/ponto}" aria-current="page"
            >◷ <span>Meu ponto</span></a
          ><a th:href="@{/relatorios}" data-role="ADMIN" hidden
            >▤ <span>Relatórios</span></a
          ><a th:href="@{/gestao-turmas}" data-role="ADMIN" hidden
            >▦ <span>Turmas</span></a
          ><a th:href="@{/usuarios}" data-role="ADMIN" hidden
            >♙ <span>Usuários</span></a
          ><a th:href="@{/configuracoes}">⚙ <span>Configurações</span></a>
        </nav>
        <div class="hc-sidebar-footer">
          <button type="button" class="hc-btn secondary" data-theme-toggle>
            ◐
          </button>
          <form th:action="@{/logout}" method="post">
            <button class="hc-logout">Sair</button>
          </form>
        </div>
      </aside>
      <main class="hc-main">
        <header class="hc-header">
          <div>
            <h1>Registros de ponto</h1>
            <p>Consulte horas, turmas e observações.</p>
          </div>
          <a class="hc-btn primary" th:href="@{/perfil}">Registrar ponto</a>
        </header>
        <section class="hc-card" id="filtrosRegistros" data-filter-root>
          <div class="hc-filter-toolbar">
            <button
              class="hc-btn secondary"
              type="button"
              data-filter-toggle
              aria-expanded="false"
            >
              Filtros
              <span class="hc-filter-active-badge" data-filter-active-badge hidden
                >Ativos</span
              >
            </button>
            <button
              class="hc-btn secondary"
              type="button"
              data-filter-clear-active
              data-limpar-registros
              hidden
            >
              Limpar filtros
            </button>
          </div>
          <div class="hc-filter-panel" data-filter-panel hidden>
            <form id="formFiltros">
            <div class="hc-form-grid">
              <div class="hc-field">
                <label for="periodoRapido">Período</label
                ><select id="periodoRapido">
                  <option value="mes">Este mês</option>
                  <option value="semana">Esta semana</option>
                  <option value="hoje">Hoje</option>
                  <option value="30dias">Últimos 30 dias</option>
                  <option value="custom">Personalizado</option>
                  <option value="todos" selected>Todos</option>
                </select>
              </div>
              <div class="hc-field">
                <label for="professorId">Professor</label
                ><select id="professorId">
                  <option value="">Todos permitidos</option>
                </select>
              </div>
              <div class="hc-field">
                <label for="inicio">Data inicial</label
                ><input type="date" id="inicio" />
              </div>
              <div class="hc-field">
                <label for="fim">Data final</label
                ><input type="date" id="fim" />
              </div>
              <div class="hc-field">
                <label for="turmaFiltro">Turma</label
                ><select id="turmaFiltro">
                  <option value="">Todas</option>
                </select>
              </div>
              <div class="hc-field">
                <label for="statusFiltro">Status</label
                ><select id="statusFiltro">
                  <option value="">Todos</option>
                  <option value="ABERTO">Aberto</option>
                  <option value="FECHADO">Fechado</option>
                </select>
              </div>
              <div class="hc-field full">
                <label for="busca">Busca</label
                ><input
                  id="busca"
                  placeholder="Professor, código da turma, atividade ou observação"
                />
              </div>
            </div>
            <div class="hc-actions">
              <button class="hc-btn primary" type="submit">
                Aplicar filtros</button
              ><button
                class="hc-btn secondary"
                type="button"
                data-limpar-registros
              >
                Limpar filtros
              </button>
            </div>
            </form>
          </div>
        </section>
        <section class="hc-grid two" style="margin-top: 20px">
          <article class="hc-card hc-stat">
            <span class="hc-muted">Registros</span
            ><strong id="totalRegistros">0</strong>
          </article>
          <article class="hc-card hc-stat">
            <span class="hc-muted">Horas trabalhadas</span
            ><strong id="totalHoras">0,00 h</strong>
          </article>
        </section>
        <section class="hc-card" style="margin-top: 20px">
          <div class="hc-table-wrap">
            <table class="hc-table">
              <thead>
                <tr>
                  <th>Professor</th>
                  <th>Turma/atividade</th>
                  <th>Entrada</th>
                  <th>Saída</th>
                  <th>Horas</th>
                  <th>Status</th>
                  <th>Observação</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody id="corpoRegistros">
                <tr>
                  <td colspan="8" class="hc-empty">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <div class="hc-modal" id="modalAjuste">
      <div class="hc-modal-panel" style="max-width: 620px">
        <div class="hc-modal-head">
          <h2>Ajustar registro</h2>
          <button class="hc-btn secondary" type="button" data-fechar-ajuste>
            Fechar
          </button>
        </div>
        <form id="formAjuste">
          <input type="hidden" id="ajusteId" />
          <div class="hc-form-grid">
            <div class="hc-field">
              <label for="ajusteEntrada">Entrada</label
              ><input type="datetime-local" id="ajusteEntrada" required />
            </div>
            <div class="hc-field">
              <label for="ajusteSaida">Saída</label
              ><input type="datetime-local" id="ajusteSaida" required />
            </div>
            <div class="hc-field full">
              <label for="ajusteObservacao">Observação</label
              ><textarea id="ajusteObservacao" maxlength="1000"></textarea>
            </div>
            <div class="hc-field full">
              <label for="ajusteJustificativa">Justificativa obrigatória</label
              ><textarea
                id="ajusteJustificativa"
                maxlength="500"
                required
                placeholder="Explique por que o ponto foi corrigido"
              ></textarea>
            </div>
          </div>
          <div class="hc-actions">
            <button class="hc-btn primary" type="submit">
              Salvar ajuste auditado
            </button>
          </div>
        </form>
      </div>
    </div>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/MeuPonto.js}"></script>
  </body>
</html>
