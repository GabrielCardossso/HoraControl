<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Meu Ponto</title>
    <!-- Link dinâmico mapeado para a pasta correta do Spring Boot -->
    <link rel="stylesheet" th:href="@{/css/MeuPonto.css}">
  </head>

  <body class="corpo-ponto-page">
    <div class="container-ponto-page">
      
      <!-- Sidebar com rotas e links dinâmicos do Thymeleaf -->
      <div class="sidebar-ponto-page">
        <a th:href="@{/perfil}" style="text-decoration: none; color: inherit; width: 100%;">
          <div class="item-menu-ponto-page">
            <img th:src="@{/img/Perfil.png}" alt="Meu Perfil" />
            <span>Meu Perfil</span>
          </div>
        </a>
        
        <a th:href="@{/ponto}" style="text-decoration: none; color: inherit; width: 100%;">
          <div class="item-menu-ponto-page active-ponto-page">
            <img th:src="@{/img/CartãoPonto.png}" alt="Meu Ponto" />
            <span>Meu Ponto</span>
          </div>
        </a>
        
        <a th:href="@{/configuracoes}" style="text-decoration: none; color: inherit; width: 100%;">
          <div class="item-menu-ponto-page">
            <img th:src="@{/img/Engrenagem.png}" alt="Configurações" />
            <span>Configurações</span>
          </div>
        </a>

        <!-- Logout seguro adequado para o Spring Security -->
        <form th:action="@{/logout}" method="POST" style="display: inline; width: 100%; margin-top: auto;">
          <button type="submit" class="item-menu-ponto-page" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; padding: 12px 0;">
            <span style="color: #ef4444; font-weight: bold; margin-left: 10px;">Sair</span>
          </button>
        </form>
      </div>

      <!-- Conteúdo principal -->
      <div class="main-ponto-page">
        <div class="container-bloco-ponto-page">
          <h1>Gestão de Meu Ponto</h1>

          <!-- PAINEL DE FILTROS AVANÇADOS COMBINADOS -->
          <div class="filtros-box-ponto" style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
            
            <!-- Filtro por Tipo de Registro / Função -->
            <div style="flex: 1; min-width: 150px;">
              <label for="filtroTipo" style="font-size: 12px; font-weight: bold; color: #666; display: block; margin-bottom: 5px;">Função / Tipo</label>
              <select id="filtroTipo" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; background: white; outline: none;">
                <option value="">Todos</option>
                <option value="Aula Normal">Aula Normal</option>
                <option value="Atividade Extra">Atividade Extra</option>
              </select>
            </div>

            <!-- Filtro por Data Exata -->
            <div style="flex: 1; min-width: 150px;">
              <label for="filtroData" style="font-size: 12px; font-weight: bold; color: #666; display: block; margin-bottom: 5px;">Data do Ponto</label>
              <input type="date" id="filtroData" style="width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; outline: none; box-sizing: border-box;" />
            </div>

            <!-- Filtro por Nome da Turma / Tarefa -->
            <div style="flex: 2; min-width: 250px;">
              <label for="filtroTarefa" style="font-size: 12px; font-weight: bold; color: #666; display: block; margin-bottom: 5px;">Buscar Turma / Aula</label>
              <input type="text" id="filtroTarefa" placeholder="Digite o nome da turma ou atividade..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; outline: none; box-sizing: border-box;" />
            </div>

            <!-- Botões de Ação do Painel -->
            <div style="display: flex; gap: 10px; align-items: flex-end;">
              <button id="btnLimparFiltros" style="padding: 10px 15px; background-color: #f4f4f4; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; cursor: pointer; color: #333; height: 41px; transition: background 0.2s;">Limpar</button>
              
              <!-- Botão Gerar Relatório Combinado das Linhas Selecionadas -->
              <button id="btnGerarRelatorio" style="padding: 10px 20px; background-color: #198754; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; height: 41px; box-shadow: 0 4px 10px rgba(25, 135, 84, 0.2); transition: all 0.2s;">Relatório</button>
            </div>
          </div>

          <!-- TABELA DE REGISTROS COM CHECKBOXES -->
          <table id="tabelaLembrete" class="tabela-ponto-page">
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="selecionarTodos" /></th>
                <th>Tipo de Registro</th>
                <th>Data</th>
                <th>Hora Entrada / Saída</th>
                <th>Turma / Tarefa</th>
                <th>Status</th>
                <th>Anotações</th>
              </tr>
            </thead>
            <tbody>
              <!-- Renderizado dinamicamente pelo JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ESTRUTURA DA MINI ABA (MODAL) PARA MOSTRAR A OBSERVAÇÃO -->
    <div id="modalAnotacoes" class="modal-anotacoes-container">
      <div class="modal-anotacoes-content">
        <span class="modal-anotacoes-close">&times;</span>
        <h3>Observações do Registro</h3>
        <p id="modalTextoAnotacao">Nenhuma observação informada.</p>
      </div>
    </div>

    <!-- Script JavaScript mapeado no contexto static -->
    <script th:src="@{/js/MeuPonto.js}"></script>
  </body>
</html>
