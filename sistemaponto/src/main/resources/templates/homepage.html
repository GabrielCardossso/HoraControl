<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23007acc%22/><text x=%2232%22 y=%2241%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2224%22 font-weight=%22700%22 fill=%22white%22>HC</text></svg>" />
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <link rel="stylesheet" th:href="@{/css/Interacoes.css}">
  </head>

  <body class="corpo-login-page">
    <div class="wrapper-login-page">
      <div class="motivational-login-page">
        <p class="text-motiv-login"></p>
      </div>

      <div class="row-box-login">
        <div class="side-image-login-page"></div>

        <div class="card-box-login">
          <img
            th:src="@{/img/b0091c4a-e98d-4afa-8cb6-fda9ae1fe25f.png}"
              alt="Logo"
                class="logo-login-page"
        />

          <!-- CONTAINER DO FORMULÁRIO -->
          <div class="form-login-page">
            
            <!-- CORRIGIDO: Agora envia os dados para a URL correta do Spring Security -->
            <form th:action="@{/login}" method="POST">
              
              <!-- Campo de e-mail mapeado como username -->
              <input 
                type="email" 
                name="username" 
                placeholder="E-mail" 
                class="input-login-page" 
                required 
              />
              
              <!-- Campo de senha -->
              <input 
                type="password" 
                name="password" 
                placeholder="Senha" 
                class="input-login-page" 
                required 
              />
              
              <a href="#" class="forgot-link-login">Esqueci minha senha</a>
              
              <!-- Botão que dispara o envio das credenciais -->
              <button type="submit" class="btn-submit-login">Entrar</button>

            </form>

          </div>
        </div>
      </div>
    </div>
    <script th:src="@{/js/Interacoes.js}"></script>
  </body>
</html>
