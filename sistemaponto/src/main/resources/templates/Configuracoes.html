<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações - Painel do Professor</title>
    <link rel= "stylesheet" th:href="@{/css/Configurações.css}">
  </head>

  <body class="corpo-config-page">
    <div class="container-config-page">
      <!-- Sidebar -->
      <div class="sidebar-config-page">
        <div class="item-menu-config-page">
          <img th:src="@{/img/Perfil.png}" alt="MeuPerfil" />
          <span>Meu Perfil</span>
        </div>
        <div class="item-menu-config-page">
          <img th:src="@{/img/CartãoPonto.png}" alt="MeuPonto" />
          <span>Meu Ponto</span>
        </div>
        <div class="item-menu-config-page active-config-page">
          <img th:src="@{/img/Engrenagem.png}" alt="Configuracoes" />
          <span>Configurações</span>
        </div>
      </div>

      <!-- Conteúdo principal -->
      <div class="main-config-page">
        <div class="header-config-page">
          <h2>Configurações do Sistema ⚙️</h2>
          <p>
            Gerencie seus dados pessoais, senha e preferências da sua conta.
          </p>
        </div>

        <div class="container-bloco-config-page">
          <h1>Minha Conta</h1>

          <form id="formConfiguracoes">
            <div class="secao-box-config">
              <h3>👤 Dados Pessoais</h3>
              <div class="grupo-input-config">
                <label for="nomeProf">Nome Completo</label>
                <input
                  type="text"
                  id="nomeProf"
                  value="Alisson Silva"
                  readonly
                />
              </div>
              <div class="grupo-input-config">
                <label for="emailProf">E-mail Cadastrado</label>
                <input
                  type="email"
                  id="emailProf"
                  value="alisson.professor@escola.com"
                />
              </div>
            </div>

            <div class="secao-box-config">
              <h3>🔒 Alterar Senha</h3>
              <div class="grupo-input-config">
                <label for="senhaAtual">Senha Atual</label>
                <input
                  type="password"
                  id="senhaAtual"
                  placeholder="Digite sua senha atual"
                />
              </div>
              <div class="grupo-input-config">
                <label for="novaSenha">Nova Senha</label>
                <input
                  type="password"
                  id="novaSenha"
                  placeholder="Mínimo 6 caracteres"
                />
              </div>
            </div>

            <div class="secao-box-config">
              <h3>🔔 Notificações</h3>
              <div class="checkbox-row-config">
                <input type="checkbox" id="notifPonto" checked />
                <label for="notifPonto"
                  >Lembrar-me de registrar a saída do ponto diariamente</label
                >
              </div>
            </div>

            <div class="submit-row-config">
              <button type="submit" class="btn-salvar-config-page">
                Salvar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="/js/Configuracoes.js"></script>
  </body>
</html>
