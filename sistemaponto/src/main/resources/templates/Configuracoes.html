<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações - Painel do Professor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23007acc%22/><text x=%2232%22 y=%2241%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2224%22 font-weight=%22700%22 fill=%22white%22>HC</text></svg>" />
    <link rel="stylesheet" th:href="@{/css/Configuracoes.css}" />
    <link rel="stylesheet" th:href="@{/css/Interacoes.css}" />
  </head>

  <body class="corpo-config-page">
    <div class="container-config-page">
      <div class="sidebar-config-page">
        <a th:href="@{/perfil}" class="link-menu-config">
          <div class="item-menu-config-page">
            <img th:src="@{/img/Perfil.png}" alt="Meu Perfil" />
            <span>Meu Perfil</span>
          </div>
        </a>
        <a th:href="@{/ponto}" class="link-menu-config">
          <div class="item-menu-config-page">
            <img th:src="@{/img/CartãoPonto.png}" alt="Meu Ponto" />
            <span>Meu Ponto</span>
          </div>
        </a>
        <a th:href="@{/configuracoes}" class="link-menu-config" aria-current="page">
          <div class="item-menu-config-page active-config-page">
            <img th:src="@{/img/Engrenagem.png}" alt="Configurações" />
            <span>Configurações</span>
          </div>
        </a>

        <form th:action="@{/logout}" method="POST" class="form-logout-config">
          <button type="submit" class="item-menu-config-page btn-logout-config">
            <span>Sair</span>
          </button>
        </form>
      </div>

      <main class="main-config-page">
        <header class="header-config-page">
          <h2>Configurações do Sistema ⚙️</h2>
          <p>Gerencie seus dados pessoais, senha e preferências da sua conta.</p>
        </header>

        <div class="container-bloco-config-page">
          <h1>Minha Conta</h1>

          <form id="formConfiguracoes">
            <section class="secao-box-config">
              <h3>👤 Dados Pessoais</h3>
              <div class="grid-inputs-config">
                <div class="grupo-input-config">
                  <label for="nomeProf">Nome Completo</label>
                  <input type="text" id="nomeProf" value="Alisson Silva" readonly />
                </div>
                <div class="grupo-input-config">
                  <label for="emailProf">E-mail Cadastrado</label>
                  <input type="email" id="emailProf" value="alisson.professor@escola.com" />
                </div>
              </div>
            </section>

            <section class="secao-box-config">
              <h3>🔒 Alterar Senha</h3>
              <div class="grid-inputs-config">
                <div class="grupo-input-config">
                  <label for="senhaAtual">Senha Atual</label>
                  <input type="password" id="senhaAtual" placeholder="Digite sua senha atual" />
                </div>
                <div class="grupo-input-config">
                  <label for="novaSenha">Nova Senha</label>
                  <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" />
                </div>
              </div>
            </section>

            <section class="secao-box-config secao-notificacao-config">
              <h3>🔔 Notificações</h3>
              <div class="checkbox-row-config">
                <input type="checkbox" id="notifPonto" checked />
                <label for="notifPonto">Lembrar-me de registrar a saída do ponto diariamente</label>
              </div>
            </section>

            <div class="submit-row-config">
              <button type="submit" class="btn-salvar-config-page">Salvar Alterações</button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script th:src="@{/js/Configuracoes.js}"></script>
    <script th:src="@{/js/Interacoes.js}"></script>
  </body>
</html>
