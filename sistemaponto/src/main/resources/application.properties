spring.application.name=sistemaponto
spring.config.import=optional:file:.env.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistemaPonto}
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${PORT:8080}

horacontrol.admin.email=${ADMIN_EMAIL:admin@sistemaponto.com}
horacontrol.admin.password=${ADMIN_PASSWORD:${LOCAL_ADMIN_PASSWORD:}}
